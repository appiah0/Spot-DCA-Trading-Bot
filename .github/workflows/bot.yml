name: dca-bot
on:
  schedule:
    - cron: "5 * * * *"      # hourly; the strategy uses 4h candles so this is plenty
  workflow_dispatch:
    inputs:
      action:
        description: "auto = normal run, buy/sell = manual trade"
        type: choice
        default: auto
        options: [auto, buy, sell]
      symbol:
        description: "Coin pair for a manual trade, e.g. BTC/USDT"
        default: BTC/USDT
      usd:
        description: "Amount in USD for a manual trade"
        default: "10"
permissions:
  contents: write
concurrency:
  group: dca-bot
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python bot.py
        env:
          API_KEY: ${{ secrets.API_KEY }}
          API_SECRET: ${{ secrets.API_SECRET }}
          API_PASSWORD: ${{ secrets.API_PASSWORD }}   # only OKX needs this
          BOT_CONFIG: ${{ vars.BOT_CONFIG }}          # settings, edited by the web app
          MANUAL_ACTION: ${{ github.event.inputs.action }}
          MANUAL_SYMBOL: ${{ github.event.inputs.symbol }}
          MANUAL_USD: ${{ github.event.inputs.usd }}
      - name: save state
        run: |
          git config user.name "dca-bot"
          git config user.email "dca-bot@users.noreply.github.com"
          git add state.json || true
          git diff --cached --quiet || (git commit -m "update state" && git push)
