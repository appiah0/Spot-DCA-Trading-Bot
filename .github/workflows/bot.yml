name: dca-bot
on:
  schedule:
    - cron: "5 * * * *"      # hourly; strategy uses 4h candles so this is plenty
  workflow_dispatch:
permissions:
  contents: write
concurrency: dca-bot
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python bot.py
        env:
          API_KEY: ${{ secrets.API_KEY }}
          API_SECRET: ${{ secrets.API_SECRET }}
          TESTNET: "1"
          EXCHANGE: binance
          DATA_EXCHANGE: binance
          SYMBOL: BTC/USDT
          BASE_USD: "10"
      - name: save state
        run: |
          git config user.name "dca-bot"
          git config user.email "dca-bot@users.noreply.github.com"
          git add state.json || true
          git diff --cached --quiet || (git commit -m "update state" && git push)
