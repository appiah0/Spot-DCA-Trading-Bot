name: dca-bot
on:
  schedule:
    - cron: "5 * * * *"      # hourly; the strategy uses 4h candles so this is plenty
  workflow_dispatch:
permissions:
  contents: write
concurrency: dca-bot
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python bot.py
        env:
          API_KEY: ${{ secrets.API_KEY }}
          API_SECRET: ${{ secrets.API_SECRET }}
          API_PASSWORD: ${{ secrets.API_PASSWORD }}   # only OKX needs this
          TESTNET: "1"                 # 1 = fake money. Change to 0 only after weeks of testing
          EXCHANGE: binance            # binance | bybit | okx | mexc
          DATA_EXCHANGE: binanceus       # candle source; try binanceus if blocked
          SYMBOL: BTC/USDT
          BASE_USD: "10"
          NEWS_GUARD: "1"
          USE_FNG: "0"                 # set 1 only if the backtest shows it helps
      - name: save state
        run: |
          git config user.name "dca-bot"
          git config user.email "dca-bot@users.noreply.github.com"
          git add state.json || true
          git diff --cached --quiet || (git commit -m "update state" && git push)
